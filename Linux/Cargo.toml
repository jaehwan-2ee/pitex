[workspace]
resolver = "2"
members = [
    "crates/tex-domain",
    "crates/project-core",
    "crates/document-session-core",
    "crates/language-core",
    "crates/build-core",
    "crates/synctex-core",
    "crates/ai-core",
    "crates/parity-kit",
    "crates/app-ports",
    "crates/project-feature",
    "crates/editor-feature",
    "crates/build-feature",
    "crates/pdf-feature",
    "crates/settings-feature",
    "crates/linux-platform",
    "crates/gtk-editor-adapter",
    "crates/pitex-shell",
    "crates/pitex",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "PolyForm-Shield-1.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
getrandom = "0.2"
flate2 = "1"
dirs = "5"
regex = "1"
gtk4 = { version = "0.8" }
libadwaita = { version = "0.6", package = "libadwaita" }
sourceview5 = "0.8"
vte4 = "0.7"
url = "=2.5.8"
uuid = { version = "=1.10.0", features = ["v4"] }

[profile.release]
opt-level = 2
