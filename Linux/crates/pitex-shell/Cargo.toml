[package]
name = "pitex-shell"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
dirs.workspace = true
regex.workspace = true
tex-domain = { path = "../tex-domain" }
project-core = { path = "../project-core" }
document-session-core = { path = "../document-session-core" }
language-core = { path = "../language-core" }
build-core = { path = "../build-core" }
git-core = { path = "../git-core" }
synctex-core = { path = "../synctex-core" }
app-ports = { path = "../app-ports" }
project-feature = { path = "../project-feature" }
editor-feature = { path = "../editor-feature" }
build-feature = { path = "../build-feature" }
pdf-feature = { path = "../pdf-feature" }
settings-feature = { path = "../settings-feature" }
gtk-editor-adapter = { path = "../gtk-editor-adapter" }
terminal-core = { path = "../terminal-core" }
# pangocairo draws Pango layouts onto the terminal DrawingArea's cairo
# surface — only used by the non-VTE embedded terminal.
pangocairo = "0.19"
remote-core = { path = "../remote-core" }
gtk4.workspace = true
libadwaita.workspace = true
sourceview5.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
linux-platform = { path = "../linux-platform" }
vte4 = { workspace = true, optional = true }
webkit6 = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-platform = { path = "../../../Windows/crates/windows-platform" }

# API level: GTK 4.10 / libadwaita 1.4+. Ubuntu 22.04 ships GTK 4.6 /
# libadwaita 1.1 — building with --no-default-features produces that
# compatibility variant. Ubuntu 24.04+ and Windows keep the modern API level.
# The `vte` feature (embedded VTE terminal) exists only on Unix — Windows
# builds use `modern-gtk` without it and take the external-terminal fallback,
# like the Ubuntu 22.04 build. `markdown-preview` (WebKitGTK 6.0) is wired the
# same way: on for every Unix build — the ubuntu2204 deb variant turns it on
# explicitly — off on Windows, where the preview pane shows an
# unavailability page instead.
[features]
default = ["modern-gtk", "vte", "markdown-preview"]
modern-gtk = ["gtk4/v4_10", "libadwaita/v1_4"]
vte = ["dep:vte4"]
markdown-preview = ["dep:webkit6"]
