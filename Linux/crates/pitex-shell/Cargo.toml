[package]
name = "pitex-shell"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
flate2.workspace = true
dirs.workspace = true
regex.workspace = true
tex-domain = { path = "../tex-domain" }
project-core = { path = "../project-core" }
document-session-core = { path = "../document-session-core" }
language-core = { path = "../language-core" }
build-core = { path = "../build-core" }
synctex-core = { path = "../synctex-core" }
app-ports = { path = "../app-ports" }
project-feature = { path = "../project-feature" }
editor-feature = { path = "../editor-feature" }
build-feature = { path = "../build-feature" }
pdf-feature = { path = "../pdf-feature" }
settings-feature = { path = "../settings-feature" }
linux-platform = { path = "../linux-platform" }
gtk-editor-adapter = { path = "../gtk-editor-adapter" }
gtk4.workspace = true
libadwaita.workspace = true
sourceview5.workspace = true
vte4 = { workspace = true, optional = true }

# Ubuntu 22.04 ships GTK 4.6 / libadwaita 1.1 / no VTE-GTK4 — building with
# --no-default-features produces that variant. Ubuntu 24.04+ keeps the
# default full-feature build.
[features]
default = ["modern-gtk"]
modern-gtk = ["gtk4/v4_10", "libadwaita/v1_4", "dep:vte4"]
