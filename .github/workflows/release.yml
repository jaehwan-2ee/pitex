name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos-dmg:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release app
        run: |
          xcodebuild -project Mac/Pitex.xcodeproj -scheme Pitex \
            -configuration Release -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=''
      - name: Ad-hoc sign and create DMG
        run: |
          APP="build/Build/Products/Release/Pitex.app"
          codesign --deep --force --sign - "$APP" || true
          hdiutil create -volname Pitex -srcfolder "$APP" -ov -format UDZO \
            "Pitex-${GITHUB_REF_NAME}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: '*.dmg'

  linux-deb:
    name: Linux deb (Ubuntu 24.04+)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            libvte-2.91-gtk4-dev libpoppler-glib-dev dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deb
      - name: Build deb (modern-gtk variant)
        run: cargo deb --package pitex
        working-directory: Linux
      - name: Rename artifact
        run: |
          mv Linux/target/debian/pitex_*.deb \
            "Pitex-${GITHUB_REF_NAME}-ubuntu24.04-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu2404
          path: 'Pitex-*.deb'

  linux-deb-ubuntu2204:
    name: Linux deb (Ubuntu 22.04)
    # Built inside the real 22.04 container so the compat variant compiles
    # and links against GTK 4.6 / libadwaita 1.1 — and dpkg-shlibdeps emits
    # dependencies satisfiable on 22.04. There is no VTE-GTK4 on 22.04.
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config libssl-dev curl \
            ca-certificates git dpkg-dev \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            libpoppler-glib-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deb
      - name: Build deb (compat variant)
        run: cargo deb --package pitex --variant ubuntu2204
        working-directory: Linux
      - name: Rename artifact
        run: |
          mv Linux/target/debian/pitex_*.deb \
            "Pitex-${GITHUB_REF_NAME}-ubuntu22.04-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu2204
          path: 'Pitex-*.deb'

  windows-zip:
    name: Windows bundle (MSYS2 UCRT64)
    # Portable zip: pitex.exe + the GTK runtime DLLs and resources, bundled
    # by Windows/build.sh under a real UCRT64 toolchain.
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            zip
      - name: Build and bundle
        run: bash Windows/build.sh
      - name: Create zip
        run: |
          cd Windows/dist
          zip -qr "${GITHUB_WORKSPACE}/Pitex-${GITHUB_REF_NAME}-windows-amd64.zip" pitex
      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }
      # Per-user NSIS installer — the recommended way to install (double-
      # click, Start Menu entry, Add/Remove Programs, no admin). The in-app
      # updater drives it with /S.
      - name: Build installer
        run: |
          cd Windows
          '/c/Program Files (x86)/NSIS/makensis.exe' -V2 \
            -DVERSION="${GITHUB_REF_NAME#v}" \
            -DOUTFILE="Pitex-${GITHUB_REF_NAME}-windows-amd64-setup.exe" pitex.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: 'Pitex-*.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: 'Windows/Pitex-*-setup.exe'

  publish:
    name: Publish GitHub Release
    needs: [macos-dmg, linux-deb, linux-deb-ubuntu2204, windows-zip]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Pitex ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*

      # Keep the Homebrew cask in jaehwan-2ee/homebrew-tap in step with the
      # release: bump `version` + `sha256` to the freshly built DMG. Requires
      # the HOMEBREW_TAP_TOKEN secret (a token that can push to the tap
      # repo); the step is skipped silently without it.
      - name: Update Homebrew cask
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          SHA=$(shasum -a 256 "dist/Pitex-${TAG}-macos-arm64.dmg" | cut -d' ' -f1)
          # Fetch the cask from the tap and bump only version+sha256, so the
          # committed cask stays the single source of truth for its fields.
          gh api repos/jaehwan-2ee/homebrew-tap/contents/Casks/pitex.rb \
            -q .content | base64 -d > pitex.rb
          sed -i \
            -e "s/^  version .*/  version \"${VERSION}\"/" \
            -e "s/^  sha256 .*/  sha256 \"${SHA}\"/" \
            pitex.rb
          gh api repos/jaehwan-2ee/homebrew-tap/contents/Casks/pitex.rb \
            -X PUT \
            -f message="pitex ${TAG}" \
            -f content="$(base64 -w0 pitex.rb)" \
            -f sha="$(gh api repos/jaehwan-2ee/homebrew-tap/contents/Casks/pitex.rb -q .sha)"
