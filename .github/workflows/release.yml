name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-dmg:
    name: macOS DMG
    runs-on: macos-latest
    needs: [bundle-helpers]
    steps:
      - uses: actions/checkout@v4
      - name: Compute release name
        run: echo "NAME=$(printf '%s' "$GITHUB_REF_NAME" | tr / -)" >> "$GITHUB_ENV"
      - name: Download bundled preview-engine payload
        uses: actions/download-artifact@v4
        with:
          name: pe-helpers
          path: .
      - name: Unpack payload (preserve exec bits)
        run: |
          mkdir -p pe-payload
          tar -xf pe-payload.tar -C pe-payload
      - name: Build release app
        run: |
          xcodebuild -project Mac/Pitex.xcodeproj -scheme Pitex \
            -configuration Release -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=''
      # Helpers land in Contents/Helpers/PreviewEngine (code only) — the
      # client's first probe path; notices/provenance go to
      # Contents/Resources/PreviewEngine. The payload was built by the
      # bundle-helpers job (macos-15) and is installed here.
      - name: Install bundled preview engine into app
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release/Pitex.app"
          [ -d "$APP" ] || { echo "release app not found: $APP" >&2; exit 1; }
          # pe-payload/ artifact carries Contents/Helpers + Contents/Resources.
          cp -R pe-payload/Contents/Helpers/.   "$APP/Contents/Helpers/"
          cp -R pe-payload/Contents/Resources/. "$APP/Contents/Resources/"
      - name: Audit bundled preview engine
        run: |
          APP="build/Build/Products/Release/Pitex.app"
          bash PreviewEngine/tools/audit-linkage.sh \
            "$APP/Contents/Helpers/PreviewEngine" \
            "$APP/Contents/Resources/PreviewEngine"
          # W7+A2-W1 fail-closed minos audit: every Mach-O under
          # Contents/Helpers must target ≤ macOS 15.0 (the app minimum).
          find "$APP/Contents/Helpers" -type f | while read -r bin; do
            if vtool -show-build "$bin" >/dev/null 2>&1; then
              m=$(vtool -show-build "$bin" | awk '/minos/{print $2; exit}')
              [ -n "$m" ] || continue
              awk "BEGIN{exit !($m <= 15.0)}" \
                || { echo "minos $m > 15.0: $bin" >&2; exit 1; }
            fi
          done
          # W2 post-bundle: no helper links glib/gobject/gio/intl/pcre, and
          # every non-system dep is @loader_path-local.
          find "$APP/Contents/Helpers" -type f | while read -r bin; do
            otool -L "$bin" 2>/dev/null | grep -qE 'glib|gobject|gio|intl|pcre' \
              && { echo "forbidden lib in $bin" >&2; exit 1; } || true
            otool -L "$bin" 2>/dev/null | awk 'NR>1{print $1}' \
              | grep -vE '^/usr/lib|^/System|@loader_path' \
              | grep -q . && { echo "non-loader_path dep in $bin" >&2; exit 1; } || true
          done
          # W7/A2: pdfjs manifest pin + count + hash; helper name-set + notices.
          ( cd "$APP/Contents/Resources/pdfjs" \
            && shasum -a 256 -c MANIFEST.sha256 >/dev/null \
            && [ "$(find . -type f ! -name MANIFEST.sha256 | wc -l | tr -d ' ')" = 209 ] )
          [ "$(shasum -a 256 "$APP/Contents/Resources/pdfjs/MANIFEST.sha256" | cut -d' ' -f1)" \
            = cf0b7eb2630942778746ecf7f6c0e32222220780beb3908a0930d1ed058e6366 ] \
            || { echo "pdfjs MANIFEST pin mismatch" >&2; exit 1; }
          # Helper payload NAME sets (not a count — the CI build has no
          # glib/intl/pcre2). bin: the two helpers; lib: one dylib each.
          AH="$APP/Contents/Helpers/PreviewEngine"
          find "$AH" -maxdepth 1 -type f ! -name '*.dylib' -exec basename {} \; \
            | LC_ALL=C sort > /tmp/h.txt
          printf '%s\n' pitex-preview pitex-preview-xetex > /tmp/h.want
          diff /tmp/h.txt /tmp/h.want || { echo "helper bin set mismatch" >&2; exit 1; }
          find "$AH/lib" -type f -name '*.dylib' -exec basename {} \; \
            | sed -E 's/\.[0-9.]+\.dylib$//; s/\.dylib$//' | LC_ALL=C sort -u > /tmp/l.txt
          printf '%s\n' libTECkit libfreetype libgraphite2 libharfbuzz \
            libicudata libicuuc libpng16 libz > /tmp/l.want
          diff /tmp/l.txt /tmp/l.want || { echo "helper dylib set mismatch" >&2; exit 1; }
          # Notices: presence of the fixed project/provenance files plus one
          # license for each bundled lib. No count (harfbuzz AUTHORS may be
          # copied if present in the tarball). B4/U44: icu4c@78/LICENSE (not
          # icu4c); no harfbuzz/COPYING — CI builds harfbuzz from source so
          # its notice is only external/harfbuzz/COPYING.
          RP="$APP/Contents/Resources/PreviewEngine"
          for n in BUNDLED-VERSIONS.txt PROVENANCE.md provenance.json \
            THIRD-PARTY.md TeXpresso-LICENSE.txt Tectonic-MIT.txt \
            XeTeX-SIL-MIT.txt \
            external/teckit/COPYING \
            external/teckit/license/License_LGPLv21.txt \
            external/harfbuzz/COPYING \
            freetype/LICENSE.TXT graphite2/LICENSE icu4c@78/LICENSE \
            libpng/LICENSE zlib/LICENSE; do
            [ -e "$RP/$n" ] || { echo "missing notice $n" >&2; exit 1; }
          done
      - name: Ad-hoc sign and create DMG
        run: |
          APP="build/Build/Products/Release/Pitex.app"
          # Hard fail on signing problems — no `|| true`: the bundled helpers
          # must seal cleanly on the runner (notices live under
          # Contents/Resources, never Contents/Helpers).
          codesign --deep --force --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          hdiutil create -volname Pitex -srcfolder "$APP" -ov -format UDZO \
            "Pitex-${NAME}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: '*.dmg'

  linux-deb:
    name: Linux deb (Ubuntu 24.04+)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compute release name
        run: echo "NAME=$(printf '%s' "$GITHUB_REF_NAME" | tr / -)" >> "$GITHUB_ENV"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            libvte-2.91-gtk4-dev libpoppler-glib-dev libwebkitgtk-6.0-dev \
            libteckit-dev libharfbuzz-dev libgraphite2-dev libicu-dev \
            libfreetype-dev libfontconfig-dev libpng-dev zlib1g-dev \
            dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deb
      # Helper binaries land under Linux/target/preview-engine where the
      # [package.metadata.deb] assets pick them up via ../../target/ paths
      # (cargo-deb 2.x resolves asset paths from the crate manifest dir).
      # Helpers ship stripped like the main binary — otherwise their DWARF
      # embeds the runner's build paths in the payload.
      - name: Build embedded preview helpers
        run: |
          make -C PreviewEngine BUILD_DIR="$PWD/Linux/target/preview-engine"
          strip --strip-unneeded Linux/target/preview-engine/bin/pitex-preview*
      - name: Build deb (modern-gtk variant)
        run: cargo deb --package pitex
        working-directory: Linux
      - name: Rename artifact
        run: |
          mv Linux/target/debian/pitex_*.deb \
            "Pitex-${NAME}-ubuntu24.04-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu2404
          path: 'Pitex-*.deb'

  linux-deb-ubuntu2204:
    name: Linux deb (Ubuntu 22.04)
    # Built inside the real 22.04 container so the compat variant compiles
    # and links against GTK 4.6 / libadwaita 1.1 — and dpkg-shlibdeps emits
    # dependencies satisfiable on 22.04. There is no VTE-GTK4 on 22.04.
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compute release name
        run: echo "NAME=$(printf '%s' "$GITHUB_REF_NAME" | tr / -)" >> "$GITHUB_ENV"
      - name: System dependencies
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config libssl-dev curl \
            ca-certificates git dpkg-dev \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            libpoppler-glib-dev libwebkitgtk-6.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deb
      - name: Build deb (compat variant)
        run: cargo deb --package pitex --variant ubuntu2204
        working-directory: Linux
      - name: Rename artifact
        run: |
          mv Linux/target/debian/pitex_*.deb \
            "Pitex-${NAME}-ubuntu22.04-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu2204
          path: 'Pitex-*.deb'

  windows-zip:
    name: Windows bundle (MSYS2 UCRT64)
    # Portable zip: pitex.exe + the GTK runtime DLLs and resources, bundled
    # by Windows/build.sh under a real UCRT64 toolchain.
    # C5W (user decision): no Windows download ships with 2.2.0 — the job is
    # kept for PR/dispatch only as a packaging smoke, never on a tag push.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            zip
      # B2: after setup-msys2 — the job's default shell is `msys2 {0}`, which
      # only exists once that action installs it.
      - name: Compute release name
        run: echo "NAME=$(printf '%s' "$GITHUB_REF_NAME" | tr / -)" >> "$GITHUB_ENV"
      - name: Build and bundle
        run: bash Windows/build.sh
      - name: Create zip
        run: |
          cd Windows/dist
          zip -qr "${GITHUB_WORKSPACE}/Pitex-${NAME}-windows-amd64.zip" pitex
      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }
      - name: Compute NSIS version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "NSIS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # N3: no macOS Info.plist key exists here — emit an explicit
            # placeholder for non-tag (PR/dispatch) installer builds.
            echo "NSIS_VERSION=0.0.0" >> "$GITHUB_ENV"
          fi
      # Per-user NSIS installer — the recommended way to install (double-
      # click, Start Menu entry, Add/Remove Programs, no admin). The in-app
      # updater drives it with /S.
      - name: Build installer
        run: |
          cd Windows
          '/c/Program Files (x86)/NSIS/makensis.exe' -V2 \
            -DVERSION="${NSIS_VERSION}" \
            -DOUTFILE="Pitex-${NAME}-windows-amd64-setup.exe" pitex.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: 'Pitex-*.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: 'Windows/Pitex-*-setup.exe'

  # W1/A2: helpers bundled on macos-15 so brew bottles + source builds target
  # the app's macOS 15 floor. Produces the pe-helpers artifact consumed by
  # macos-dmg. The bundle script requires DEST_DIR = .../Contents/Helpers.
  bundle-helpers:
    name: Bundle preview-engine helpers (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build + bundle preview-engine helpers
        env:
          PITEX_BUNDLE_INSTALL_DEPS: "1"
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          set -euo pipefail
          PRIV_PREFIX="$RUNNER_TEMP/pe-deps"
          export DEP_SEARCH_DIRS="$PRIV_PREFIX/lib"
          export DEP_LICENSE_DIR="$RUNNER_TEMP/pe-deplicenses"
          mkdir -p "$DEP_LICENSE_DIR/teckit" "$DEP_LICENSE_DIR/harfbuzz" \
            "$RUNNER_TEMP/pe-src" "$PRIV_PREFIX" \
            pe-payload/Contents/Helpers pe-payload/Contents/Resources
          brew install pkgconf freetype graphite2 icu4c@78 libpng zlib \
            autoconf automake libtool meson ninja
          cd "$RUNNER_TEMP/pe-src"
          SHA_TK=3f55cd3670f1ff1a439d5a40071870b9e4ca2be8877a0eb80e24783cb532b380
          SHA_HB=b7132e148358a45185c9feafd049dbaf243649d3c44414b3534d9c95d18592b9
          curl -fsSLO https://github.com/silnrsi/teckit/releases/download/v2.5.13/teckit-2.5.13.tar.xz
          curl -fsSLO https://github.com/harfbuzz/harfbuzz/releases/download/14.5.0/harfbuzz-14.5.0.tar.xz
          echo "$SHA_TK  teckit-2.5.13.tar.xz" | shasum -a 256 -c -
          echo "$SHA_HB  harfbuzz-14.5.0.tar.xz" | shasum -a 256 -c -
          tar xJf teckit-2.5.13.tar.xz && cd teckit-2.5.13
          ./autogen.sh
          ./configure --prefix="$PRIV_PREFIX" --with-system-zlib
          make -j"$(sysctl -n hw.ncpu)" && make install
          cp COPYING "$DEP_LICENSE_DIR/teckit/"
          cp -R license "$DEP_LICENSE_DIR/teckit/license"
          cd "$RUNNER_TEMP/pe-src" && tar xJf harfbuzz-14.5.0.tar.xz && cd harfbuzz-14.5.0
          meson setup build --prefix="$PRIV_PREFIX" --buildtype=release \
            -Dglib=disabled -Dgobject=disabled -Dcairo=disabled \
            -Dchafa=disabled -Dicu=disabled -Dgraphite=enabled \
            -Dgraphite2=enabled -Dfreetype=enabled -Dtests=disabled \
            -Ddocs=disabled -Dutilities=disabled -Dbenchmark=disabled \
            -Dintrospection=disabled
          ninja -C build && ninja -C build install
          cp COPYING AUTHORS "$DEP_LICENSE_DIR/harfbuzz/" 2>/dev/null || cp COPYING "$DEP_LICENSE_DIR/harfbuzz/"
          export PKG_CONFIG_PATH="$PRIV_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          # W5/A2-D6: keg-only icu4c@78 — resolve via its own pkgconfig dir.
          # (N4: assignment split from export so a brew failure isn't masked.)
          ICU_PREFIX="$(brew --prefix icu4c@78)"
          export ICU_PREFIX
          PKG_CONFIG_PATH="$ICU_PREFIX/lib/pkgconfig" pkg-config --modversion icu-uc \
            | grep -q '^78\.' || { echo "ICU major != 78" >&2; exit 1; }
          # W2/A2: source-built deps must resolve to the private prefix.
          for p in harfbuzz teckit; do
            [ "$(pkg-config --variable=prefix "$p" 2>/dev/null)" = "$PRIV_PREFIX" ] \
              || { echo "bundle: $p resolves to $(pkg-config --variable=prefix "$p" 2>/dev/null), not $PRIV_PREFIX" >&2; exit 1; }
          done
          # DEST_DIR must end .../Contents/Helpers (script enforces it).
          bash "$GITHUB_WORKSPACE/Tools/bundle-preview-engine-macos.sh" \
            "$RUNNER_TEMP/pitex-preview-engine" \
            "$GITHUB_WORKSPACE/pe-payload/Contents/Helpers"
          # B1: the dep builds cd'd into $RUNNER_TEMP/pe-src/… — return to the
          # workspace before the payload-relative audit + tar.
          cd "$GITHUB_WORKSPACE"
          # B3/U43: check the EXPECTED NAMES, not a count (the CI payload has
          # no glib/intl/pcre2). Helpers = pitex-preview, pitex-preview-xetex
          # + one each of libTECkit/libfreetype/libgraphite2/libharfbuzz/
          # libicudata.78/libicuuc.78/libpng16/libz; nothing else.
          H="$GITHUB_WORKSPACE/pe-payload/Contents/Helpers/PreviewEngine"
          [ -d "$H" ] || { echo "no helper payload dir: $H" >&2; exit 1; }
          find "$H" -maxdepth 1 -type f ! -name '*.dylib' -exec basename {} \; \
            | LC_ALL=C sort > /tmp/helpers.txt
          printf '%s\n' pitex-preview pitex-preview-xetex > /tmp/helpers.want
          diff /tmp/helpers.txt /tmp/helpers.want \
            || { echo "helper bin set mismatch" >&2; exit 1; }
          find "$H/lib" -type f -name '*.dylib' -exec basename {} \; \
            | sed -E 's/\.[0-9.]+\.dylib$//; s/\.dylib$//' | LC_ALL=C sort -u > /tmp/libs.txt
          printf '%s\n' libTECkit libfreetype libgraphite2 libharfbuzz \
            libicudata libicuuc libpng16 libz > /tmp/libs.want
          diff /tmp/libs.txt /tmp/libs.want \
            || { echo "helper dylib set mismatch" >&2; exit 1; }
          # D6: assert the bundled ICU dylibs are major 78.
          find "$H/lib" -name 'libicuuc.*' | grep -q 'libicuuc\.78\.' \
            || { echo "bundled ICU not major 78" >&2; exit 1; }
          # upload-artifact drops file modes (all files 644) — tar the payload
          # so the helper/dylib exec bits survive into macos-dmg.
          tar -cf pe-payload.tar -C pe-payload Contents
      - uses: actions/upload-artifact@v4
        with:
          name: pe-helpers
          path: pe-payload.tar


  apparmor-userns:
    name: AppArmor userns proof (Ubuntu 24.04 deb)
    needs: [linux-deb, linux-deb-ubuntu2204]
    runs-on: ubuntu-24.04
    # Proves the deb's AppArmor profile unblocks WebKit's bubblewrap sandbox
    # on a stock ubuntu-24.04 runner (restriction ON). Lives here (not
    # ci.yml) because it consumes the built deb artifacts.
    steps:
      - uses: actions/checkout@v4
      - name: Download the deb artifacts only
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - name: Assert the runner is stock (restriction ON)
        run: |
          set -e
          sysctl -n kernel.apparmor_restrict_unprivileged_userns
          [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "1" ] \
            || { echo "restriction is not 1; the proof is vacuous" >&2; exit 1; }
      - name: R2 - 24.04 deb ships the profile + conffile; 22.04 ships neither
        run: |
          set -e
          D24=$(ls dist/*ubuntu24.04*.deb); D22=$(ls dist/*ubuntu22.04*.deb)
          echo "24.04: $D24"; echo "22.04: $D22"
          # J1: conffiles member has no ./ prefix
          dpkg-deb -c "$D24" | grep -q 'etc/apparmor\.d/pitex' \
            || { echo "24.04 deb lacks the profile file" >&2; exit 1; }
          dpkg-deb --ctrl-tarfile "$D24" | tar -xO conffiles | grep -q '/etc/apparmor\.d/pitex' \
            || { echo "24.04 profile not a conffile" >&2; exit 1; }
          ! dpkg-deb -c "$D22" | grep -q 'apparmor' \
            || { echo "22.04 deb must not ship the profile" >&2; exit 1; }
          ! dpkg-deb --ctrl-tarfile "$D22" | tar -xO conffiles 2>/dev/null | grep -q 'apparmor' \
            || { echo "22.04 deb must not declare the conffile" >&2; exit 1; }
      - name: Upgrade path - install 2.1.6 first, then this deb (no prompt)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y wget
          wget -q -O /tmp/pitex-2.1.6.deb \
            "https://github.com/jaehwan-2ee/pitex/releases/download/v2.1.6/Pitex-v2.1.6-ubuntu24.04-amd64.deb"
          sudo apt-get install -y /tmp/pitex-2.1.6.deb
          # The published 2.1.6 deb lacks the new preview-engine deps; install
          # the new deb via apt so they resolve, and so a conffile prompt would
          # block on the closed stdin. Log dpkg options so a force-conf default
          # cannot silently mask a prompt.
          apt-config dump | grep -i 'dpkg::options' || true
          ls /etc/dpkg/dpkg.cfg.d/ || true
          sudo apt-get install -y "$(readlink -f "$(ls dist/*ubuntu24.04*.deb)")" < /dev/null
          [ -f /etc/apparmor.d/pitex ] || { echo "profile missing after upgrade" >&2; exit 1; }
      - name: Confirm the profile loaded
        run: |
          set -e
          grep -q '^pitex ' /sys/kernel/security/apparmor/profiles \
            || { echo "profile not loaded"; cat /sys/kernel/security/apparmor/profiles >&2; exit 1; }
      - name: Negative control - profile unloaded must abort on open
        run: |
          set -e
          sudo apparmor_parser -R /etc/apparmor.d/pitex 2>/dev/null || true
          printf '\\documentclass{article}\\begin{document}x\\end{document}\n' > /tmp/f.tex
          set +e
          GSK_RENDERER=cairo xvfb-run -a dbus-run-session -- timeout 25 /usr/bin/pitex /tmp/f.tex > /tmp/neg.log 2>&1
          rc=$?
          set -e
          cat /tmp/neg.log
          if [ "$rc" = "124" ]; then
            echo "control did NOT abort (still running) - proof is vacuous" >&2; exit 1
          fi
          grep -Eq 'bwrap: setting up uid map|dbus-proxy|Trace/breakpoint|SIGTRAP' /tmp/neg.log \
            || { echo "control failed for an unexpected reason" >&2; exit 1; }
          echo "control aborted as expected (rc=$rc)"
      - name: Positive - profile loaded, app opens and stays alive
        run: |
          set -e
          sudo apparmor_parser -r -T -W /etc/apparmor.d/pitex
          printf '\\documentclass{article}\\begin{document}x\\end{document}\n' > /tmp/f.tex
          set +e
          GSK_RENDERER=cairo xvfb-run -a dbus-run-session -- timeout 25 /usr/bin/pitex /tmp/f.tex > /tmp/pos.log 2>&1
          rc=$?
          set -e
          cat /tmp/pos.log
          if [ "$rc" != "124" ]; then
            echo "app did not stay alive for 25s (rc=$rc)" >&2; exit 1
          fi
          if grep -Eq 'bwrap: setting up uid map|dbus-proxy|Trace/breakpoint|SIGTRAP' /tmp/pos.log; then
            echo "sandbox abort signature present despite the profile" >&2; exit 1
          fi
          echo "positive run stayed alive, clean of the abort signature"
      - name: Purge - file and loaded profile are gone
        run: |
          set -e
          sudo apt-get purge -y pitex
          [ ! -e /etc/apparmor.d/pitex ] || { echo "conffile left behind" >&2; exit 1; }
          ! grep -q '^pitex ' /sys/kernel/security/apparmor/profiles \
            || { echo "profile still loaded after purge" >&2; exit 1; }
      - name: No-AppArmor container installs exit 0 (right deb per image)
        run: |
          set -e
          # J3: each deb goes into its own Ubuntu release; 24.04 deps do not
          # exist on 22.04, so the 24.04 deb there is meaningless.
          docker run --rm -v "$PWD/dist":/d ubuntu:24.04 sh -e -c \
            'apt-get update -qq >/dev/null; apt-get install -y /d/*ubuntu24.04*.deb >/dev/null; echo "24.04 ok"'
          docker run --rm -v "$PWD/dist":/d ubuntu:22.04 sh -e -c \
            'apt-get update -qq >/dev/null; apt-get install -y /d/*ubuntu22.04*.deb >/dev/null; echo "22.04 ok"'

  publish:
    name: Publish GitHub Release
    needs: [macos-dmg, linux-deb, linux-deb-ubuntu2204, apparmor-userns]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # W9/A3-D5: publish only on a real tag push — never on pull_request or
    # workflow_dispatch (where GITHUB_REF_NAME is "<N>/merge").
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      # D4: fetch only the 5 shipping artifacts — one step each, so the
      # selection is by name (no glob matcher). pe-helpers is never fetched.
      - uses: actions/download-artifact@v4
        with: { name: dmg,               path: dist }
      - uses: actions/download-artifact@v4
        with: { name: deb-ubuntu2404,    path: dist }
      - uses: actions/download-artifact@v4
        with: { name: deb-ubuntu2204,    path: dist }
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # W9: curated notes file when present, else generated notes. The
          # flag is computed BEFORE the command — never a comment inside the
          # line-continuation.
          NOTES_ARGS=(--generate-notes)
          if [ -f ".github/release-notes/${GITHUB_REF_NAME}.md" ]; then
            NOTES_ARGS=(--notes-file ".github/release-notes/${GITHUB_REF_NAME}.md")
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "Pitex ${GITHUB_REF_NAME}" \
            "${NOTES_ARGS[@]}" \
            dist/*

      # Keep the Homebrew cask in jaehwan-2ee/homebrew-tap in step with the
      # release: bump `version` + `sha256` to the freshly built DMG. Requires
      # the HOMEBREW_TAP_TOKEN secret (a token that can push to the tap
      # repo); the step is skipped silently without it.
      - name: Update Homebrew cask
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          SHA=$(shasum -a 256 "dist/Pitex-${TAG}-macos-arm64.dmg" | cut -d' ' -f1)
          # Fetch the cask from the tap and bump only version+sha256, so the
          # committed cask stays the single source of truth for its fields.
          gh api repos/jaehwan-2ee/homebrew-tap/contents/Casks/pitex.rb \
            -q .content | base64 -d > pitex.rb
          sed -i \
            -e "s/^  version .*/  version \"${VERSION}\"/" \
            -e "s/^  sha256 .*/  sha256 \"${SHA}\"/" \
            pitex.rb
          gh api repos/jaehwan-2ee/homebrew-tap/contents/Casks/pitex.rb \
            -X PUT \
            -f message="pitex ${TAG}" \
            -f content="$(base64 -w0 pitex.rb)" \
            -f sha="$(gh api repos/jaehwan-2ee/homebrew-tap/contents/Casks/pitex.rb -q .sha)"
