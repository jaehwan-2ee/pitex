name: Input method audit
on:
  push:
    branches: [codex/caps-lock-audit]
  workflow_dispatch:
jobs:
  macos:
    name: Native macOS Caps Lock editing
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native key events through the real editor adapter
        run: swift test --package-path Packages/TexApp --build-system native --filter EditorMacAdapterLayoutTests.testNativeDigitsAndDeletionWithCapsLock
  git-render:
    name: Hidden Git pane responsiveness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libvte-2.91-gtk4-dev libpoppler-glib-dev xvfb gdb
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p pitex-shell --lib --no-run
        working-directory: Linux
      - name: Reproduce large Git status during startup
        timeout-minutes: 2
        working-directory: Linux
        env:
          PITEX_AUDIT_GIT_ROWS: '20000'
        run: |
          binary=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'pitex_shell-*' | head -1)
          xvfb-run -a gdb -batch -return-child-result -ex run -ex 'thread apply all bt 12' --args "$binary" startup_tests::small_project_opens_without_blocking_the_ui --ignored --nocapture --test-threads=1 > ../git-audit.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: git-render-audit
          path: git-audit.log
  ibus:
    name: IBus Caps Lock (${{ matrix.ubuntu }})
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v4
      - name: Install native input stack
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3-gi gir1.2-gtk-4.0 libglib2.0-bin ibus-hangul ibus-gtk4 dbus-x11 xvfb xdotool
      - name: Compare forwarded and native key handling
        timeout-minutes: 5
        run: |
          for scenario in true:1 false:1 false:0; do
            forwarding=${scenario%:*}
            sync=${scenario#*:}
            xvfb-run -a dbus-run-session -- bash -eu -s -- "$forwarding" "$sync" <<'SESSION' > "input-$forwarding-sync-$sync.log" 2>&1 || true
          gsettings set org.freedesktop.ibus.engine.hangul switch-keys Caps_Lock
          gsettings set org.freedesktop.ibus.engine.hangul use-event-forwarding "$1"
          gsettings list-recursively org.freedesktop.ibus.engine.hangul
          dpkg-query -W ibus ibus-hangul libgtk-4-1 libgtk-4-1t64 2>/dev/null || true
          ibus-daemon -drx --panel disable
          sleep 2
          ibus engine hangul
          GTK_IM_MODULE=ibus IBUS_ENABLE_SYNC_MODE="$2" GSK_RENDERER=cairo python3 Tools/audit-ibus-capslock.py
          SESSION
            cat "input-$forwarding-sync-$sync.log"
            grep -q '^INPUT_AUDIT_SUMMARY ' "input-$forwarding-sync-$sync.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-audit-${{ matrix.ubuntu }}
          path: input-*.log
