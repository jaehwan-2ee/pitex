name: IBus compatibility regression
on:
  push:
    branches: [main, codex/caps-lock-audit]
    paths: ['Linux/**', '.github/workflows/ibus-compat.yml', 'Tools/audit-ibus-capslock.py']
  pull_request:
    paths: ['Linux/**', '.github/workflows/ibus-compat.yml', 'Tools/audit-ibus-capslock.py']
  workflow_dispatch:
jobs:
  caps:
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    steps:
      - uses: actions/checkout@v4
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y gcc pkg-config libibus-1.0-dev python3-gi gir1.2-gtk-4.0 gir1.2-gtksource-5 libglib2.0-bin ibus-hangul ibus-gtk4 dbus-x11 xvfb xdotool
          gcc -shared -fPIC -O2 Linux/crates/pitex/src/ibus_compat.c -o /tmp/pitex-ibus-probe.so $(pkg-config --cflags --libs gio-2.0) -ldl
      - name: Build the actual app and verify the linked adapter
        run: |
          apt-get install -y build-essential curl ca-certificates libssl-dev libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libpoppler-glib-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo build --manifest-path Linux/Cargo.toml -p pitex --no-default-features
          nm -D Linux/target/debug/pitex | grep ' T ibus_input_context_process_key_event$'
      - name: Real editor and document synchronization in every preedit mode
        timeout-minutes: 3
        run: |
          cargo test --manifest-path Linux/Cargo.toml -p pitex-shell --no-default-features --test ime --no-run
          for mode in syllable word none; do
            xvfb-run -a dbus-run-session -- bash -eu -s -- "$mode" <<'SESSION' > "compat-native-$mode.log" 2>&1
          gsettings reset org.freedesktop.ibus.engine.hangul initial-input-mode
          gsettings set org.freedesktop.ibus.engine.hangul switch-keys Caps_Lock
          gsettings set org.freedesktop.ibus.engine.hangul use-event-forwarding true
          gsettings set org.freedesktop.ibus.engine.hangul preedit-mode "$1"
          ibus-daemon -drx --panel disable
          sleep 2
          ibus engine hangul
          GTK_IM_MODULE=ibus IBUS_ENABLE_SYNC_MODE=1 GSK_RENDERER=cairo LD_PRELOAD=/tmp/pitex-ibus-probe.so cargo test --manifest-path Linux/Cargo.toml -p pitex-shell --no-default-features --test ime -- --ignored --nocapture --test-threads=1
          SESSION
          done
      - name: Audit unmodified system IBus with the app-local adapter
        timeout-minutes: 10
        run: |
          for scenario in true:1 false:1 true:0 false:0; do
            forwarding=${scenario%:*}
            sync=${scenario#*:}
            xvfb-run -a dbus-run-session -- bash -eu -s -- "$forwarding" "$sync" <<'SESSION' > "compat-$forwarding-$sync.log" 2>&1
          gsettings set org.freedesktop.ibus.engine.hangul switch-keys Caps_Lock
          gsettings reset org.freedesktop.ibus.engine.hangul preedit-mode
          gsettings reset org.freedesktop.ibus.engine.hangul initial-input-mode
          gsettings set org.freedesktop.ibus.engine.hangul use-event-forwarding "$1"
          ibus-daemon -drx --panel disable
          sleep 2
          ibus engine hangul
          GTK_IM_MODULE=ibus IBUS_ENABLE_SYNC_MODE="$2" GSK_RENDERER=cairo LD_PRELOAD=/tmp/pitex-ibus-probe.so python3 -c 'import ctypes, runpy; ctypes.CDLL("/tmp/pitex-ibus-probe.so").pitex_ibus_initialize(); runpy.run_path("Tools/audit-ibus-capslock.py", run_name="__main__")'
          SESSION
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ibus-compat-${{ matrix.ubuntu }}
          path: compat-*.log
