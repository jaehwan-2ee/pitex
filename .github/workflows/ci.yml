name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  updates:
    name: Update installers (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python Tools/check-updates.py

  gates:
    name: Repository gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node Tools/verify-target-dag.mjs
      - run: node Tools/verify-rust-dag.mjs
      - run: node Tools/validate-xcodeproj.mjs
      - run: node Tools/generate-sbom.mjs
      - run: node Tools/verify-release-surface.mjs

  swift:
    name: Swift packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3.3'
      - run: swift test
        working-directory: Packages/TexCore
      - run: swift test
        working-directory: Packages/TexApp

  macos:
    name: macOS app and native editor checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release app
        run: |
          xcodebuild -project Mac/Pitex.xcodeproj -scheme Pitex \
            -configuration Release -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=''
      - name: Native editor regression checks
        run: swift test --package-path Packages/TexApp --build-system native
      - name: Git and subprocess regression checks
        run: |
          swift test --package-path Packages/TexCore --build-system native --filter 'GitSupportTests|ProcessRunnerTests'
          python3 Tools/check-git-performance.py
      - name: Native highlighting checks
        run: python3 Tools/check-highlighting-performance.py
      - name: Minimap and completion checks
        run: python3 Tools/check-editor-performance.py

  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            libvte-2.91-gtk4-dev libpoppler-glib-dev xvfb gdb
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
        working-directory: Linux
      - name: Native GTK editing and PDF worker checks
        run: xvfb-run -a cargo test -p pitex-shell --test native -- --ignored
        working-directory: Linux
      - name: Full window startup and small project check
        run: |
          binary=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'pitex_shell-*' | head -1)
          xvfb-run -a gdb -batch -return-child-result -ex run -ex 'thread apply all bt' --args "$binary" startup_tests::small_project_opens_without_blocking_the_ui --ignored --nocapture --test-threads=1
        working-directory: Linux
      - name: Compare release optimization profiles
        run: python3 Tools/check-optimization-profiles.py

  rust-ubuntu2204:
    name: Rust workspace (Ubuntu 22.04 compat)
    # 22.04 has GTK 4.6 / libadwaita 1.1 and ships no VTE-GTK4 — the compat
    # build (--no-default-features) must compile and link against exactly
    # these system libraries, so the job runs inside the real container.
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config libssl-dev curl \
            ca-certificates git \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev \
            libpoppler-glib-dev xvfb xdotool ibus-hangul dbus-x11
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p pitex --no-default-features
        working-directory: Linux
      - name: Real Hangul Backspace on GTK 4.6
        timeout-minutes: 3
        working-directory: Linux
        run: |
          xvfb-run -a dbus-run-session -- bash -c '
            gsettings set org.freedesktop.ibus.engine.hangul initial-input-mode true
            ibus-daemon -drx --panel disable
            sleep 2
            ibus engine hangul
            GTK_IM_MODULE=ibus GSK_RENDERER=cairo cargo test -p pitex-shell --no-default-features --test ime -- --ignored --nocapture --test-threads=1
          '
      - name: Million-file Git pane on GTK 4.6
        timeout-minutes: 3
        working-directory: Linux
        env:
          GSK_RENDERER: cairo
        run: xvfb-run -a dbus-run-session -- cargo test -p pitex-shell --lib --no-default-features startup_tests::small_project_opens_without_blocking_the_ui -- --ignored --nocapture --test-threads=1


  windows:
    name: Windows workspace (MSYS2 UCRT64)
    # The Windows app links the MSYS2 GTK stack, so the authoritative compile
    # gate is a real UCRT64 toolchain — no cross-compile from Linux.
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gtksourceview5
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
      - run: cargo build -p pitex-windows
        working-directory: Windows
