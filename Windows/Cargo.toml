[workspace]
resolver = "2"
members = [
    "crates/windows-platform",
    "crates/pitex-windows",
]

[workspace.package]
edition = "2021"
# webview2-com 0.39 / windows 0.62 (the Markdown preview engine) declare
# rust-version 1.82 — the Windows build's floor.
rust-version = "1.82"
license = "PolyForm-Shield-1.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
uuid = { version = "=1.10.0", features = ["v4"] }

[profile.release]
opt-level = 2
lto = "thin"
