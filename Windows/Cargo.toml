[workspace]
resolver = "2"
members = [
    "crates/windows-platform",
    "crates/pitex-windows",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "PolyForm-Shield-1.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
uuid = { version = "=1.10.0", features = ["v4"] }

[profile.release]
opt-level = 2
