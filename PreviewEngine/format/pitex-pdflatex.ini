% Pitex preview: pdfLaTeX personality of the XeTeX-based preview engine.
% Used for documents whose build runs pdflatex. LaTeX must see an 8-bit
% pdfTeX: 8-bit input decoded by its utf8 inputenc, OT1/T1 TFM fonts and the
% pdftex drivers (hyperref, graphics, l3backend), which the engine implements.
\XeTeXinputencoding "bytes"
\XeTeXdefaultencoding "bytes"
\input pdftexconfig.tex
% The preview writer's compression (level 6 without object streams, as in the
% XeLaTeX format): pdftexconfig's 9/2 recompresses every cached stream on each
% publication and does not change what the PDF shows.
\pdfcompresslevel=6 \pdfobjcompresslevel=0
\chardef\pdftexversion=140
\begingroup \catcode`\{=1 \catcode`\}=2
\gdef\pdftexrevision{25}
\gdef\pdftexbanner{This is pdfTeX, Version 3.141592653-2.6-1.40.25}
\endgroup
% Every XeTeX-only primitive (the engine's registration list); LaTeX and
% packages test these to pick Unicode fonts and the xetex drivers.
\let\XeTeXversion\undefined \let\XeTeXrevision\undefined
\let\XeTeXOTcountfeatures\undefined \let\XeTeXOTcountlanguages\undefined
\let\XeTeXOTcountscripts\undefined \let\XeTeXOTfeaturetag\undefined
\let\XeTeXOTlanguagetag\undefined \let\XeTeXOTscripttag\undefined
\let\XeTeXcharclass\undefined \let\XeTeXcharglyph\undefined
\let\XeTeXcountfeatures\undefined \let\XeTeXcountglyphs\undefined
\let\XeTeXcountselectors\undefined \let\XeTeXcountvariations\undefined
\let\XeTeXdashbreakstate\undefined \let\XeTeXdefaultencoding\undefined
\let\XeTeXdelcode\undefined \let\XeTeXdelcodenum\undefined
\let\XeTeXdelimiter\undefined \let\XeTeXfeaturecode\undefined
\let\XeTeXfeaturename\undefined \let\XeTeXfindfeaturebyname\undefined
\let\XeTeXfindselectorbyname\undefined
\let\XeTeXfindvariationbyname\undefined \let\XeTeXfirstfontchar\undefined
\let\XeTeXfonttype\undefined \let\XeTeXgenerateactualtext\undefined
\let\XeTeXglyph\undefined \let\XeTeXglyphbounds\undefined
\let\XeTeXglyphindex\undefined \let\XeTeXglyphname\undefined
\let\XeTeXhyphenatablelength\undefined \let\XeTeXinputencoding\undefined
\let\XeTeXinputnormalization\undefined
\let\XeTeXinterchartokenstate\undefined \let\XeTeXinterchartoks\undefined
\let\XeTeXinterwordspaceshaping\undefined
\let\XeTeXisdefaultselector\undefined \let\XeTeXisexclusivefeature\undefined
\let\XeTeXlastfontchar\undefined \let\XeTeXlinebreaklocale\undefined
\let\XeTeXlinebreakpenalty\undefined \let\XeTeXlinebreakskip\undefined
\let\XeTeXmathaccent\undefined \let\XeTeXmathchar\undefined
\let\XeTeXmathchardef\undefined \let\XeTeXmathcharnum\undefined
\let\XeTeXmathcharnumdef\undefined \let\XeTeXmathcode\undefined
\let\XeTeXmathcodenum\undefined \let\XeTeXpdffile\undefined
\let\XeTeXpdfpagecount\undefined \let\XeTeXpicfile\undefined
\let\XeTeXprotrudechars\undefined \let\XeTeXradical\undefined
\let\XeTeXselectorcode\undefined \let\XeTeXselectorname\undefined
