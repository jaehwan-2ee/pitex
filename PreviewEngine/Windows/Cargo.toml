[package]
name = "pitex-preview-windows"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "AGPL-3.0-or-later AND MIT"

[workspace]

[dependencies]
serde_json = "1"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[bin]]
name = "pitex-preview"
path = "src/main.rs"

[profile.release]
opt-level = 2
panic = "abort"
